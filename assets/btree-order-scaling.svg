  <text x="450" y="34" fill="#F8FAFC" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="24" font-weight="600" text-anchor="middle">同样三层，能装多少关键字？</text><text x="70" y="106.0" fill="#F8FAFC" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle">4 阶</text><rect x="127.0" y="65.0" width="146.0" height="82.0" rx="22.0" fill="#A3BCF7" opacity="0.100"/><rect x="132.0" y="70.0" width="136.0" height="72.0" rx="17.0" fill="#A3BCF7" opacity="0.160"/><rect x="135.5" y="73.5" width="129.0" height="65.0" rx="13.5" fill="#A3BCF7" opacity="0.280"/><rect x="138.0" y="76.0" width="124.0" height="60.0" rx="11.0" fill="#A3BCF7" opacity="0.500"/><rect x="140" y="78.0" width="120.0" height="56" rx="9" fill="#3B5BA5" stroke="#8FA9E8" stroke-width="1.8"/><text x="200.0" y="106.0" fill="#F8FAFC" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle">最多 63 个</text><text x="70" y="210.0" fill="#F8FAFC" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle">100 阶</text><rect x="127.0" y="169.0" width="486.0" height="82.0" rx="22.0" fill="#A3BCF7" opacity="0.100"/><rect x="132.0" y="174.0" width="476.0" height="72.0" rx="17.0" fill="#A3BCF7" opacity="0.160"/><rect x="135.5" y="177.5" width="469.0" height="65.0" rx="13.5" fill="#A3BCF7" opacity="0.280"/><rect x="138.0" y="180.0" width="464.0" height="60.0" rx="11.0" fill="#A3BCF7" opacity="0.500"/><rect x="140" y="182.0" width="460.0" height="56" rx="9" fill="#3B5BA5" stroke="#8FA9E8" stroke-width="1.8"/><text x="370.0" y="210.0" fill="#F8FAFC" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle">约 100 万个</text><text x="70" y="314.0" fill="#F8FAFC" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle">512 阶</text><rect x="127.0" y="273.0" width="776.0" height="82.0" rx="22.0" fill="#A3BCF7" opacity="0.100"/><rect x="132.0" y="278.0" width="766.0" height="72.0" rx="17.0" fill="#A3BCF7" opacity="0.160"/><rect x="135.5" y="281.5" width="759.0" height="65.0" rx="13.5" fill="#A3BCF7" opacity="0.280"/><rect x="138.0" y="284.0" width="754.0" height="60.0" rx="11.0" fill="#A3BCF7" opacity="0.500"/><rect x="140" y="286.0" width="750.0" height="56" rx="9" fill="#3B5BA5" stroke="#8FA9E8" stroke-width="1.8"/><text x="515.0" y="314.0" fill="#F8FAFC" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle">约 1.34 亿个</text><text x="450" y="398" fill="#F8FAFC" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="18" text-anchor="middle">高度三层的 m 阶 B 树最多存 m³ − 1 个关键字；阶数由存储页大小决定</text>
