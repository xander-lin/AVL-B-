<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    text{font-family:"Noto Sans CJK SC",system-ui,sans-serif;fill:#F8FAFC;text-anchor:middle;dominant-baseline:middle}
